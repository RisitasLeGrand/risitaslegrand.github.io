<ng-template #content let-modal>
    <div class="modal-header">
        <h4
            class="modal-title"
            id="modal-basic-title"
        >Confirmer ?</h4>
        <button
            class="btn-close"
            aria-label="Fermer"
            (click)="modal.dismiss()"
        ></button>
    </div>
    <div class="modal-body">
        All your progresses will be deleted.<br>Are you sure you want to proceed with the reset?
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-outline-secondary"
            (click)="modal.dismiss()"
        >Annuler</button>
        <button
            class="btn btn-danger"
            (click)="modal.close()"
        >Continuer</button>
    </div>
</ng-template>

<div>
    <div
        ngbDropdown
        container="body"
    >
        <button
            class="btn"
            ngbDropdownToggle
        >Menu</button>
        <div ngbDropdownMenu>
            <small class="text-muted ms-3">Pages</small>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.Start])"
            >Commencer</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.Intro])"
            >Présentation</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.Stats])"
            >Statistiques</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.History])"
            >Historique</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.Settings])"
            >Réglages</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.Tutorials])"
            >Tutoriels</button>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.PlaygroundMode])"
            >Bac à sable</button>
            <div class="dropdown-divider"></div>
            <small class="text-muted ms-3">Fonctions</small>
            <button
                ngbDropdownItem
                (click)="import()"
            >
                <i class="bi bi-upload"></i> Importer
            </button>
            <button
                ngbDropdownItem
                (click)="export()"
            ><i class="bi bi-download"></i> Exporter</button>
            <button
                ngbDropdownItem
                (click)="toggleDarkmode()"
            >
                <ng-container *ngIf="getDarkmode(); else darkmode">
                    <i class="bi bi-sun"></i> Thème clair
                </ng-container>
                <ng-template #darkmode>
                    <i class="bi bi-moon"></i> Thème sombre
                </ng-template>
            </button>
            <button
                ngbDropdownItem
                (click)="resetGame(content)"
            ><i class="bi bi-trash3"></i> Réinitialiser</button>
            <div class="dropdown-divider"></div>
            <small class="text-muted ms-3">Liens</small>
            <button
                ngbDropdownItem
                (click)="router.navigate([EnumScreens.OtherGames])"
            >Autres jeux</button>
            <a
                ngbDropdownItem
                href="https://www.linkedin.com/in/f3d3r1c07r0774/"
                target="_blank"
            >À propos de l'auteur</a>
        </div>
    </div>
</div>
