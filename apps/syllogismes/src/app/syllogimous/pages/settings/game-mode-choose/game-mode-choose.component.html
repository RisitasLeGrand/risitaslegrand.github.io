<div class="mb-2 text-muted">Mode de jeu</div>

<div class="game-mode-choices">
    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-0" name="mode-kind" (click)="setMode('0')">
        <label for="mode-choice-0" ngbTooltip="Afficher toutes les prémisses en même temps">Toutes les prémisses</label>
    </div>

    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-1" name="mode-kind" (click)="setMode('1')">
        <label for="mode-choice-1" ngbTooltip="Une prémisse à la fois, en carrousel">Carrousel</label>
    </div>

    <div class="game-mode-choice">
        <input type="radio" id="mode-choice-2" name="mode-kind" (click)="setMode('2')">
        <label for="mode-choice-2" ngbTooltip="Une prémisse à la fois, en carrousel, sans retour en arrière">Carrousel (sans retour)</label>
    </div>
</div>

<div class="mt-3 mb-2 text-muted">Autres réglages</div>

<div class="d-grid" style="gap: 1rem; padding-inline: 0.5rem;">
    <app-input
        type="select"
        name="syllogismGenerator"
        label="Générateur de syllogismes"
        placeholder="Générateur de syllogismes"
        [ngControl]="syllogismGenerator"
        [options]="syllogismGeneratorChoices"
    />
</div>
